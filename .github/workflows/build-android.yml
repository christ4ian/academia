name: Build Academia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Firebase google-services.json & Fixed Keystore Signing
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
            echo "google-services.json restored."
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/academia.jks
            python3 - <<'EOF'
          import os, re
          gradle_path = 'android/app/build.gradle'
          s = open(gradle_path).read()
          signing_block = """
              signingConfigs {
                  debug {
                      storeFile file('academia.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          """
          if 'signingConfigs' not in s:
              s = s.replace('buildTypes {', signing_block + '\n    buildTypes {', 1)
          open(gradle_path, 'w').write(s)
          EOF
            echo "Fixed debug signing configured."
          fi

      - name: Patch Android splash color & keyboard mode
        run: |
          python3 - <<'EOF'
          import re, os
          res = 'android/app/src/main/res/values'
          os.makedirs(res, exist_ok=True)
          with open(res + '/academia_colors.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="academia_bg">#FCFBFA</color>\n</resources>\n')
          p = res + '/styles.xml'
          s = open(p).read()
          def patch(m):
              body = m.group(0)
              body = re.sub(r'\s*<item name="(android:background|android:windowBackground|windowSplashScreenBackground)">.*?</item>', '', body)
              body = body.replace('</style>', '    <item name="android:background">@color/academia_bg</item>\n        <item name="android:windowBackground">@color/academia_bg</item>\n        <item name="windowSplashScreenBackground">@color/academia_bg</item>\n    </style>')
              return body
          s = re.sub(r'<style name="(AppTheme\.NoActionBarLaunch|AppTheme\.NoActionBar|AppTheme)"[^>]*>.*?</style>', patch, s, flags=re.S)
          open(p, 'w').write(s)
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          t = re.sub(r'android:windowSoftInputMode="[^"]*"', '', t)
          t = t.replace('<activity', '<activity android:windowSoftInputMode="adjustResize"', 1)
          open(m, 'w').write(t)
          import glob
          for d in glob.glob('android/app/src/main/res/drawable*'):
              for f in glob.glob(d + '/splash.*'):
                  os.remove(f)
          os.makedirs('android/app/src/main/res/drawable', exist_ok=True)
          open('android/app/src/main/res/drawable/splash.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="#FCFBFA" />\n</shape>\n')
          EOF

      - name: Generate Android launcher icons
        run: |
          pip install pillow
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw
          src = Image.open('assets/icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          dens = {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}
          for d, k in dens.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              legacy = int(48 * k)
              img = src.resize((legacy, legacy), Image.LANCZOS)
              img.save(f'{folder}/ic_launcher.png')
              mask = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, legacy - 1, legacy - 1), fill=255)
              rnd = img.copy(); rnd.putalpha(mask)
              rnd.save(f'{folder}/ic_launcher_round.png')
              full = int(108 * k)
              inner = int(full * 0.66)
              fg = Image.new('RGBA', (full, full), (0, 0, 0, 0))
              fg.paste(src.resize((inner, inner), Image.LANCZOS), ((full - inner) // 2, (full - inner) // 2))
              fg.save(f'{folder}/ic_launcher_foreground.png')
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FCFBFA</color>\n</resources>\n')
          EOF

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Academia-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
