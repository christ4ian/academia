<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#fbfaf8"><meta name="description" content="Academia, planner akademik untuk tugas, agenda pribadi, kalender harian, catatan, dan lomba.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<title>Academia · Your academic space</title>
</head>
<body>
<div id="login-gate" class="login-gate hidden" role="region" aria-label="Halaman Masuk"></div>

<div id="app-shell">
  <div class="app">
    <aside class="sidebar">
      <a href="#home" class="brand" data-view="home"><span class="brand-icon">a.</span><span class="brand-title">academia.</span></a>
      <div class="side-caption">Workspace</div>
      <nav class="nav" id="desktop-nav"></nav>
      <div class="sidebar-foot">
        <button class="linkbtn" id="side-backup"></button>
        <div class="hint">Rencana sekolahmu, di satu tempat.<br>Tersinkron otomatis ke akunmu.</div>
      </div>
    </aside>
    <main class="main">
      <div class="frame">
        <header class="header">
          <div class="header-left">
            <span class="brandmobile" id="mobile-brand">academia.</span>
            <span class="crumb" id="breadcrumb">Workspace / Home</span>
          </div>
          <div class="header-actions">
            <span class="date-indicator" id="today-label"></span>
            <div class="settings-wrap">
              <button class="iconbtn" aria-label="Pengaturan dan data" id="settings-button"></button>
              <div class="settings-menu" id="settings-menu">
                <div id="user-menu-summary"></div>
                <button data-action="ai-settings" class="ai-setting-menu-button">Pengaturan AI (Gemini / OpenRouter)</button>
                <button data-action="type-settings">Tipe & Warna Kalender</button>
                <button data-action="export">Ekspor cadangan JSON</button>
                <button data-action="import">Impor cadangan JSON</button>
                <button data-action="empty">Mulai dengan data kosong</button>
                <button data-action="reset">Pulihkan data contoh</button>
                <button class="danger" data-action="logout">Keluar Akun</button>
              </div>
            </div>
            <button class="primary" id="header-create"></button>
          </div>
        </header>
        <div id="home" class="view active"></div>
        <div id="tasks" class="view"></div>
        <div id="calendar" class="view"></div>
        <div id="notes" class="view"></div>
      </div>
    </main>
  </div>
  <nav class="mobilebar" id="mobile-nav" aria-label="Navigasi utama"></nav>
</div>

<!-- Modal Tambah / Edit Aktivitas & Catatan -->
<div class="modal-wrap" id="modal-wrap" role="presentation">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog-header">
      <h2 id="modal-title">Tambah aktivitas</h2>
      <button id="modal-close" class="iconbtn" aria-label="Tutup"></button>
    </div>
    <div class="type-select" id="modal-types"></div>
    <div class="ai-review hidden" id="ai-review" role="status"></div>
    <form id="entry-form" class="dialog-form" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden">
      <div class="dialog-body"><div id="modal-fields"></div></div>
      <div class="modal-actions">
        <button class="ghost destructive delete hidden" type="button" id="modal-delete">Hapus</button>
        <button class="secondary" type="button" id="modal-cancel">Batal</button>
        <button class="primary" type="submit" id="modal-save">Simpan</button>
      </div>
    </form>
  </section>
</div>

<!-- Modal Rencana Hari (Susun satu hari sekaligus - Fase 4) -->
<div class="modal-wrap" id="dayplan-wrap" role="presentation">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dayplan-title">
    <div class="dialog-header">
      <h2 id="dayplan-title">Rencana Hari · Susun Sesi Belajar</h2>
      <button id="dayplan-close" class="iconbtn" aria-label="Tutup"></button>
    </div>
    <form id="dayplan-form" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden">
      <div class="dialog-body" id="dayplan-body"></div>
      <div class="modal-actions">
        <button class="secondary" type="button" id="dayplan-cancel">Batal</button>
        <button class="primary" type="submit">Simpan Jadwal Hari Ini</button>
      </div>
    </form>
  </section>
</div>

<!-- Modal Pengaturan Tipe & Warna Kalender (Fase 3) -->
<div class="modal-wrap" id="type-settings-wrap" role="presentation">
  <section class="dialog ai-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="type-settings-title">
    <div class="dialog-header">
      <h2 id="type-settings-title">Tipe & Warna Kalender</h2>
      <button type="button" class="iconbtn" id="type-settings-close" aria-label="Tutup"></button>
    </div>
    <div class="dialog-body" id="type-settings-body"></div>
    <div class="modal-actions">
      <button type="button" class="primary" id="type-settings-done">Selesai</button>
    </div>
  </section>
</div>

<!-- Modal Pengaturan AI (Gemini + OpenRouter - Fase 5) -->
<div class="modal-wrap" id="ai-settings-wrap" role="presentation">
  <section class="dialog ai-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="ai-settings-title">
    <div class="dialog-header">
      <h2 id="ai-settings-title">Pengaturan AI · Quick Add</h2>
      <button type="button" class="iconbtn" id="ai-settings-close" aria-label="Tutup pengaturan">✕</button>
    </div>
    <form id="ai-settings-form" autocomplete="off">
      <div id="ai-settings-body"></div>
      <div class="ai-settings-actions">
        <button type="button" class="ghost destructive" id="gemini-forget">Hapus key</button>
        <div class="ai-btn-group">
          <button type="button" class="secondary" id="gemini-test">Uji koneksi</button>
          <button type="submit" class="primary">Simpan</button>
        </div>
      </div>
    </form>
  </section>
</div>

<!-- Custom Picker & Confirm Dialog -->
<div class="picker-wrap" id="picker-wrap" role="presentation">
  <section class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="picker-head">
      <h3 id="picker-title"></h3>
      <button type="button" class="iconbtn" id="picker-close" aria-label="Tutup"></button>
    </div>
    <div class="picker-body" id="picker-body"></div>
    <div class="picker-foot" id="picker-foot"></div>
  </section>
</div>

<div class="confirm-wrap" id="confirm-wrap" role="presentation">
  <section class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <h2 id="confirm-title"></h2>
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button type="button" class="secondary" id="confirm-no">Batal</button>
      <button type="button" class="primary" id="confirm-yes">Lanjutkan</button>
    </div>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-input" accept="application/json,.json,text/plain" class="hidden">
<script src="app.js"></script>
</body>
</html>
